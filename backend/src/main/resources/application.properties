spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0

# Database Connection (Supabase Session Pooler)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool Tuning for Supabase Session Pooler
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Supabase ES256 JWT Verification
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI}

# Custom App Properties
app.cors.frontend-url=${FRONTEND_URL}
app.groq.api-key=${GROQ_API_KEY}
app.groq.api-url=${GROQ_API_URL}
app.groq.model=${GROQ_MODEL}
app.overpass.api-url=${OVERPASS_API_URL}